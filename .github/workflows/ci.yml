name: Verify

# 변경이 다른 곳을 깨뜨렸는지 자동으로 확인하는 검문소.
#
# 역할 분담 (2026-08-08 승격 완료 — Ubuntu/Node 20 에서 2회 연속 성공 확인 후)
#   · main 브랜치        → deploy.yml 의 verify job 이 담당하고, 실패 시 **배포가 중단**된다.
#   · 그 외 브랜치·PR    → 이 워크플로가 담당한다(배포와 무관하므로 조기 피드백용).
#   중복 실행을 피하려고 여기서는 main push 를 제외한다.

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

# 같은 브랜치에 연속 push 하면 이전 실행은 취소 — 대기 시간 절약
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # deploy.yml 과 같은 Node 버전 — 배포와 동일한 환경에서 검증한다.
      # '20' 은 최신 20.x 로 해석되며 ESLint 10 요구사항(^20.19)을 충족한다.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # 타입검사 + ESLint(신규 위반만) + tests/ 의 *Parity.ts / *Integrity.ts 전수 실행(자동 발견).
      # 분류되지 않은 테스트 파일이 있으면 여기서 실패한다 — 조용히 빠지는 테스트 방지
      - name: Verify
        run: npm run verify
