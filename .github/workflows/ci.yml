name: Verify

# 변경이 다른 곳을 깨뜨렸는지 자동으로 확인하는 검문소.
#
# ⚠️ 현재는 의도적으로 **배포와 분리**되어 있다.
#    deploy.yml 은 그대로 두고 이 워크플로만 먼저 돌려서, CI 환경(Ubuntu·Node 20)에서도
#    48개 테스트가 안정적으로 통과하는지 몇 번 관찰한다.
#    연속으로 초록불이 확인되면 그때 deploy.yml 의 build job 에
#        needs: verify
#    를 추가해 "테스트 실패 시 배포 중단"으로 승격한다.
#    (처음부터 배포에 물리면 CI 환경 차이 하나로 배포가 멈출 수 있어 순서를 나눴다.)

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# 같은 브랜치에 연속 push 하면 이전 실행은 취소 — 대기 시간 절약
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # deploy.yml 과 같은 Node 버전 — 배포와 동일한 환경에서 검증한다.
      # '20' 은 최신 20.x 로 해석되며 ESLint 10 요구사항(^20.19)을 충족한다.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # 타입검사 + ESLint(신규 위반만) + tests/ 의 *Parity.ts / *Integrity.ts 전수 실행(자동 발견).
      # 분류되지 않은 테스트 파일이 있으면 여기서 실패한다 — 조용히 빠지는 테스트 방지
      - name: Verify
        run: npm run verify
